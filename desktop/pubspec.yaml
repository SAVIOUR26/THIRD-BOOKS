name: thirdbooks
description: ThirdBooks - Professional Accounting Software for MSMEs
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^13.0.0

  # HTTP & API
  dio: ^5.4.0
  retrofit: ^4.0.0
  pretty_dio_logger: ^1.3.1

  # Local Database (Offline-First)
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Charts & Graphs
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41

  # Data Tables - using Flutter's built-in DataTable for compatibility
  # data_table_2 removed due to Flutter 3.19 compatibility issues
  pluto_grid: ^7.0.0

  # PDF Generation & Printing
  pdf: ^3.10.0
  printing: ^5.11.0

  # Excel Export
  excel: ^4.0.0

  # Date & Time
  intl: ^0.18.1

  # Utilities
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  logger: ^2.0.2+1
  uuid: ^4.3.3
  collection: ^1.18.0

  # Window Management (Desktop)
  window_manager: ^0.3.0

  # File Picker & CSV
  file_picker: ^6.1.0
  csv: ^6.0.0

  # Authentication
  jwt_decoder: ^2.0.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  retrofit_generator: ^8.0.0
  drift_dev: ^2.14.0

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/outlet_data.json
    - assets/migrations/depreciation_correction_2026_09.json
